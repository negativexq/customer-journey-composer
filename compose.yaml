name: customer-journey-composer

x-api: &api
  image: customer-journey-composer-api:dev
  build:
    context: ./apps/api
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-journey}:${POSTGRES_PASSWORD:?Run make setup first}@postgres:5432/${POSTGRES_DB:-journeys}?sslmode=disable
    HTTP_ADDR: ':8080'
    LOG_LEVEL: ${LOG_LEVEL:-info}
  init: true

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-journeys}
      POSTGRES_USER: ${POSTGRES_USER:-journey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup first}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-54329}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *api
    command: ['migrate']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *api
    ports:
      - '127.0.0.1:${API_PORT:-8090}:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/readyz']
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 15s
    restart: unless-stopped

  web:
    image: customer-journey-composer-web:dev
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'
      - '127.0.0.1:${SMTP_PORT:-1025}:1025'
    restart: unless-stopped

volumes:
  postgres-data:
