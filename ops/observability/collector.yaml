receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 64
    spike_limit_mib: 16
  batch:
    timeout: 2s
    send_batch_size: 512
exporters:
  otlp:
    endpoint: tempo:4317
    tls:
      insecure: true
    timeout: 5s
    sending_queue:
      queue_size: 128
    retry_on_failure:
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 15s
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp]
